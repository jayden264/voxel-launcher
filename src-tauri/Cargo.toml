[package]
name = "voxel-launcher"
version = "0.1.1"
description = "A modern Minecraft launcher"
# Where releases are published; the launcher asks this repository whether a newer version exists.
repository = "https://github.com/jayden264/voxel-launcher"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "voxel_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core = { path = "../crates/launcher-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
tokio-util = "0.7.20"
