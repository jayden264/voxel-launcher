[package]
name = "launcher-core"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"
description = "Minecraft launcher core: versions, downloads, Java runtime, offline accounts, launching"

[lib]
name = "launcher_core"
path = "src/lib.rs"

[[bin]]
name = "mcl"
path = "src/bin/mcl.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
flate2 = "1.1"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md5 = "0.8.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.10"
sysinfo = "0.40.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
